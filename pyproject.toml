[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sg-product-research"
version = "0.1.0"
description = "Evidence-aware product selection for China-to-Singapore ecommerce"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
sg-select = "sg_product_research.cli:main"
sg-admin = "sg_product_research.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
